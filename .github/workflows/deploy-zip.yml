name: Deploy Zip Extractor

on:
  push:
    paths:
      - 'deploy*.zip'
      - 'deploy*.ZIP'

jobs:
  extract-and-deploy:
    runs-on: ubuntu-latest
    if: github.actor == github.repository_owner
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate and extract deploy zip
        run: |
          set -e
          echo "Looking for deploy zip file..."
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "deploy*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "No deploy zip found. Exiting."
            exit 0
          fi

          echo "Found deploy file: $ZIP_FILE"
          mkdir -p /tmp/deploy_staging
          unzip -q "$ZIP_FILE" -d /tmp/deploy_staging

          # Full Project Deploy: Allow updating everything except sensitive git history and secrets
          # Protected items that should never be overwritten blindly:
          PROTECTED_ITEMS=".git raw"
          for item in $PROTECTED_ITEMS; do
            if [ -e "/tmp/deploy_staging/$item" ]; then
              echo "Notice: Skipping protected item '$item'"
              rm -rf "/tmp/deploy_staging/$item"
            fi
          done

          echo "Copying all updated files and directories into repository root..."
          cp -r /tmp/deploy_staging/* .
          # Also copy hidden files and directories (like .github) if present
          if ls -d /tmp/deploy_staging/.* 2>/dev/null | grep -v '\.$' | grep -v '\.\.$' >/dev/null; then
            cp -r /tmp/deploy_staging/.[!.]* . 2>/dev/null || true
          fi

          echo "Removing uploaded zip file from git index and workspace..."
          git rm -f --ignore-unmatch "deploy*.zip" "deploy*.ZIP" "$ZIP_FILE"
          rm -rf /tmp/deploy_staging

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes detected to commit."
          else
            git commit -m "Auto-deploy: full project update via deploy zip [$(date +'%Y-%m-%d %H:%M')]"
            git push origin HEAD:${{ github.ref }}
          fi
