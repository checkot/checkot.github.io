name: Recompute data from raw archive

# Excel আপলোড ছাড়াই data/YYYY-MM.json নতুন করে বানায়।
# ব্যবহার: GitHub > Actions > "Recompute data from raw archive" > Run workflow > month লিখুন (যেমন 2026-10) বা all

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Month (YYYY-MM) or 'all'"
        required: true
        default: "all"

permissions:
  contents: write

concurrency:
  group: excel-processing
  cancel-in-progress: false

jobs:
  recompute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl requests
      - name: Recompute
        env:
          MONTH: ${{ github.event.inputs.month }}
        run: |
          if [ "$MONTH" = "all" ]; then
            python scripts/recompute_from_raw.py --all
          else
            python scripts/recompute_from_raw.py "$MONTH"
          fi
      - name: Commit
        env:
          MONTH: ${{ github.event.inputs.month }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Recompute from raw archive [$MONTH]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref }}
          fi
