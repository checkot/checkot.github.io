name: Empress daily fetch
on:
  schedule:
    # বাংলাদেশ সময় সকাল ৯টা (UTC 3:00 AM)
    - cron: "0 3 * * *"
    # বাংলাদেশ সময় বিকেল সাড়ে ৫টা (UTC 11:30 AM)
    - cron: "30 11 * * *"
    # বাংলাদেশ সময় রাত সাড়ে ৮টা (UTC 2:00 PM)
    - cron: "0 14 * * *"
    # বাংলাদেশ সময় রাত ১১টা (UTC 5:00 PM)
    - cron: "0 17 * * *"
  workflow_dispatch: # এটি রাখলে আপনি ম্যানুয়ালিও চাইলে রান করতে পারবেন

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with: 
          python-version: "3.12"
          
      - run: pip install playwright openpyxl && playwright install --with-deps chromium
      
      - name: Fetch Excel from Empress
        run: python scripts/fetch_empress.py
        env:
          EMPRESS_ACCOUNTS: ${{ secrets.EMPRESS_ACCOUNTS }}
          
      - name: Convert Excel to JSON
        run: python scripts/to_json.py
          
      - name: Commit JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet || git commit -m "Daily automated data update [$(date +'%Y-%m-%d')]" && git push
