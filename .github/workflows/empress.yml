name: Empress test fetch
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python scripts/fetch_empress.py
        env:
          EMPRESS_ACCOUNTS: ${{ secrets.EMPRESS_ACCOUNTS }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: empress-test-output
          path: raw/
          retention-days: 7
