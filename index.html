<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    padding: 15px 12px;
    background: linear-gradient(135deg, #e9ecef 0%, #dee2e6 100%);
    margin: 0; min-height: 100vh;
  }
  .card {
    background: #ffffff; padding: 22px 18px; border-radius: 16px;
    max-width: 500px; margin: 0 auto 15px auto;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    border: 1px solid rgba(255,255,255,0.6);
  }
  .header { text-align: center; margin-bottom: 18px; }
  .header h2 { margin: 0; color: #004085; font-size: 20px; font-weight: 700; }
  .header p { color: #6c757d; margin: 4px 0 0 0; font-size: 12px; }
  label { font-weight: 600; display: block; margin-top: 12px; color: #495057; font-size: 14px; }
  input, select {
    width: 100%; padding: 11px 13px; margin-top: 5px;
    border: 1px solid #ced4da; border-radius: 8px;
    font-size: 15px; outline: none; transition: all 0.2s;
    background-color: #f8f9fa;
  }
  input:focus, select:focus {
    border-color: #0056b3; background-color: #ffffff;
    box-shadow: 0 0 0 3px rgba(0, 86, 179, 0.15);
  }
  .row { display: flex; gap: 8px; margin-top: 5px; }
  .row select { margin-top: 0; flex: 1; }
  button {
    width: 100%; background-color: #0056b3; color: white;
    border: none; padding: 12px; border-radius: 8px;
    font-size: 15px; font-weight: 600; margin-top: 15px;
    cursor: pointer; transition: 0.2s;
    box-shadow: 0 4px 10px rgba(0, 86, 179, 0.2);
  }
  button:hover { background-color: #004085; }
  button:disabled { background-color: #6c757d; cursor: not-allowed; }

  .spinner {
    display: none; width: 22px; height: 22px;
    border: 3px solid #f3f3f3; border-top: 3px solid #0056b3;
    border-radius: 50%; animation: spin 0.8s linear infinite;
    margin: 12px auto 0 auto;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  #status { margin-top: 12px; text-align: center; font-weight: 600; font-size: 14px; }
  #progress { margin-top: 6px; text-align: center; font-size: 12px; color: #6c757d; display: none; }

  #pdf-viewer {
    margin: 12px auto 0 auto; max-width: 100%; text-align: center;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  canvas {
    border: 1px solid #dee2e6; max-width: 100%; height: auto;
    border-radius: 8px; box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    display: block; margin: 0 auto;
  }

  .btn-group { display: flex; gap: 10px; margin-top: 12px; }
  .btn-action {
    background-color: #0056b3; color: white; text-align: center;
    text-decoration: none; display: none; padding: 11px;
    border-radius: 8px; font-weight: 600; flex: 1;
    font-size: 14px; cursor: pointer; border: none;
    box-shadow: 0 3px 8px rgba(0, 86, 179, 0.2);
    transition: 0.2s;
  }
  .btn-action:hover { background-color: #004085; }

  .calc-card { display: none; }
  .calc-card.show { display: block; }
  .calc-card h3 {
    margin-top: 0; color: #004085; font-size: 16px;
    border-bottom: 2px solid #0056b3; padding-bottom: 6px;
  }
  .badge {
    background: #0056b3; color: white; padding: 3px 8px;
    border-radius: 4px; font-size: 12px; font-weight: normal;
  }
  .badge.warn { background: #dc3545; }
  .grade-info {
    font-size: 12px; color: #6c757d; margin-bottom: 12px;
    padding: 6px 10px; background: #f8f9fa; border-radius: 6px;
    border-left: 3px solid #0056b3;
  }
  .input-grid {
    display: grid; grid-template-columns: 1fr 110px;
    gap: 8px; align-items: center; margin: 6px 0;
    font-size: 14px; color: #333;
  }
  .input-grid label { margin: 0; font-weight: 500; font-size: 14px; }
  .input-grid input, .input-grid select {
    margin: 0; padding: 7px 9px; font-size: 14px;
    text-align: right;
  }
  .input-grid select { text-align: left; padding: 7px 6px; font-size: 13px; }

  .report-row {
    display: flex; justify-content: space-between;
    margin: 8px 0; font-size: 14px; color: #333;
  }
  .report-row.total {
    font-weight: bold; font-size: 17px; color: #28a745;
    border-top: 1px dashed #ccc; padding-top: 10px; margin-top: 12px;
  }

  .info-list {
    background: #f8f9fa; border: 1px solid #dee2e6;
    border-radius: 6px; padding: 10px 12px; font-size: 13px;

  }

  .section-title {
    font-size: 14px; font-weight: 700; color: #004085;

    border-bottom: 2px solid #e9ecef;
  }

  .remarks-box {

  }
  .remarks-ok {

  }

  }
  .remarks-error {

  .remarks-box ul {
    margin: 6px 0 0 20px; padding: 0;

  .remarks-box li { margin: 4px 0; }

  .reset-btn {
    background-color: #6c757d; margin-top: 10px;
    font-size: 13px; padding: 9px;
  }
  .reset-btn:hover { background-color: #5a6268; }

<body>

<!-- STEP 1: Search -->

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

const GITHUB_USERNAME = "checkot";
const REPO_NAME = "checkot.github.io";

const RATE_TABLE = {
  CF:   { otRate: 38, nightRate: 300, holidayType: "hourly", holidayHours: 8, name: "Contractual (CF)" },
  JO:   { otRate: 40, nightRate: 400, holidayType: "flat",   holidayFlat: 300, name: "Junior Officer (Below B)" },
  JO_B: { otRate: 45, nightRate: 500, holidayType: "flat",   holidayFlat: 400, name: "Junior Officer B & Above" }
};

const CACHE_PREFIX = "renata_cache_v11_";
const CACHE_TTL_MS = 1000 * 60 * 60 * 24 * 30;

function getCached(month, id) {
  try {
    const raw = localStorage.getItem(CACHE_PREFIX + month + "_" + id);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (Date.now() - d.ts > CACHE_TTL_MS) {
      localStorage.removeItem(CACHE_PREFIX + month + "_" + id);
      return null;
    }
    return d;
  } catch (e) { return null; }
}
function setCache(month, id, payload) {
  try {
    localStorage.setItem(CACHE_PREFIX + month + "_" + id, JSON.stringify({ ts: Date.now(), ...payload }));
  } catch (e) {}
}

let singlePageBlobUrl = null;
let matchedPdfPage = null;
let currentPdf = null;
let currentFileUrl = null;
let currentPageNum = 1;
let currentFileName = "";
let currentSearchId = "";
let currentMonth = "";
let currentToken = 0;
const activeTasks = new Set();
let ocrWorker = null;
let detectionResult = null;

document.getElementById('employeeId').addEventListener('keydown', e => {
  if (e.key === 'Enter') findReport();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

/* ============================================================
   MAIN SEARCH — auto extraction
   ============================================================ */
async function findReport() {
  const year  = document.getElementById('yearSelect').value;
  const mon   = document.getElementById('monthSelect').value;
  const month = `${year}-${mon}`;

  const rawId = document.getElementById('employeeId').value.trim();
  const statusDiv = document.getElementById('status');
  const progressDiv = document.getElementById('progress');
  const spinner = document.getElementById('spinner');
  const searchBtn = document.getElementById('searchBtn');

  if (!rawId) { alert("অনুগ্রহ করে Employee ID লিখুন!"); return; }

  const searchId = rawId.toUpperCase();
  currentSearchId = searchId;
  currentMonth = month;

  // Reset UI
  ['step2','step3','step4','step5','step6'].forEach(id => {
    document.getElementById(id).style.display = (id === 'step2' ? 'none' : 'none');
    document.getElementById(id).classList.remove('show');
  });
  document.getElementById('downloadBtn').style.display = "none";
  document.getElementById('openBtn').style.display = "none";
  if (singlePageBlobUrl) { URL.revokeObjectURL(singlePageBlobUrl); singlePageBlobUrl = null; }
  matchedPdfPage = null;

  currentToken++;
  const myToken = currentToken;
  for (const t of activeTasks) { try { t.destroy(); } catch (e) {} }
  activeTasks.clear();

  statusDiv.style.color = "#0056b3";
  statusDiv.innerText = "সার্চ করা হচ্ছে...";
  progressDiv.style.display = "block";
  progressDiv.innerText = "";
  spinner.style.display = "block";
  searchBtn.disabled = true;

  try {
    const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/pdfs/${month}`;
    const resp = await fetch(apiUrl);
    if (!resp.ok) {
      spinner.style.display = "none";
      searchBtn.disabled = false;
      progressDiv.style.display = "none";
      statusDiv.style.color = "#dc3545";
      statusDiv.innerText = `"${month}" মাসের ফোল্ডার পাওয়া যায়নি`;
      return;
    }

    const filesData = await resp.json();
    const pdfFiles = filesData
      .filter(f => f.type === "file" && f.name.toLowerCase().endsWith('.pdf'))
      .map(f => ({ name: f.name, url: f.download_url }));

    if (pdfFiles.length === 0) {
      spinner.style.display = "none";
      searchBtn.disabled = false;
      progressDiv.style.display = "none";
      statusDiv.style.color = "#dc3545";
      statusDiv.innerText = `এই মাসে কোনো PDF নেই`;
      return;
    }

    progressDiv.innerText = `${pdfFiles.length}টি PDF স্ক্যান হচ্ছে...`;

    const match = await parallelSearch(pdfFiles, searchId, myToken, progressDiv);
    if (myToken !== currentToken) return;

    if (match) {
      await showResult(match.fileUrl, match.pageNum, match.fileName);

      spinner.style.display = "none";
      searchBtn.disabled = false;
      progressDiv.style.display = "none";
      statusDiv.style.color = "#28a745";
      statusDiv.innerText = "রিপোর্ট পাওয়া গেছে";

      // Auto extraction
      setTimeout(() => runExtraction(), 300);
    } else {
      spinner.style.display = "none";
      searchBtn.disabled = false;
      progressDiv.style.display = "none";
      statusDiv.style.color = "#dc3545";
      statusDiv.innerHTML = `আইডি "${rawId}"-এর রেকর্ড পাওয়া যায়নি`;
    }

  } catch (err) {
    console.error(err);
    spinner.style.display = "none";
    searchBtn.disabled = false;
    progressDiv.style.display = "none";
    statusDiv.style.color = "#dc3545";
    statusDiv.innerText = "সমস্যা হয়েছে! ইন্টারনেট চেক করুন।";
  }
}

/* ============================================================
   Parallel text-layer search
   ============================================================ */
async function parallelSearch(pdfFiles, searchId, myToken, progressDiv) {
  const total = pdfFiles.length;
  let scanned = 0;

  return new Promise((resolve) => {
    let settled = false;
    const finish = (result) => { if (!settled) { settled = true; resolve(result); } };

    pdfFiles.forEach((file) => {
      (async () => {
        if (myToken !== currentToken) return;
        let task = null, pdf = null;
        try {
          task = pdfjsLib.getDocument({ url: file.url, disableAutoFetch: true, rangeChunkSize: 65536 });
          activeTasks.add(task);
          pdf = await task.promise;

          for (let p = 1; p <= pdf.numPages; p++) {
            if (myToken !== currentToken || settled) break;
            const page = await pdf.getPage(p);
            const tc = await page.getTextContent();
            const text = tc.items.map(i => i.str).join(" ").toUpperCase();
            if (text.includes(searchId)) {
              finish({ page, pageNum: p, fileUrl: file.url, fileName: file.name, pdf });
              return;
            }
          }
          scanned++;
          if (progressDiv) progressDiv.innerText = `${scanned}/${total}টি ফাইল স্ক্যান হয়েছে...`;
        } catch (e) {
          console.log("PDF error:", file.name, e.message);
        } finally {
          if (task) activeTasks.delete(task);
          if (!settled && pdf) { try { await pdf.destroy(); } catch (e) {} }
        }
      })();
    });

    setTimeout(() => {
      if (!settled) {
        const check = setInterval(() => {
          if (scanned >= total || myToken !== currentToken) {
            clearInterval(check);
            finish(null);
          }
        }, 200);
      }
    }, 100);
  });
}

/* ============================================================
   Show result
   ============================================================ */
async function showResult(fileUrl, pageNum, fileName) {
  if (!currentPdf || currentFileUrl !== fileUrl) {
    const task = pdfjsLib.getDocument(fileUrl);
    currentPdf = await task.promise;
    currentFileUrl = fileUrl;
  }

  currentPageNum = pageNum;
  currentFileName = fileName;

  const page = await currentPdf.getPage(pageNum);
  matchedPdfPage = page;

  renderPageHD(page, document.getElementById('pdf-canvas'), 1.5);

  document.getElementById('step2').style.display = "block";
  document.getElementById('viewerTitle').innerText = `${currentSearchId} — ${currentMonth}`;

  singlePageBlobUrl = await extractSinglePagePdf(fileUrl, pageNum);
  const downloadBtn = document.getElementById('downloadBtn');
  downloadBtn.href = singlePageBlobUrl;
  downloadBtn.setAttribute('download', `Overtime_${currentSearchId}_${currentMonth}.pdf`);
  downloadBtn.style.display = "block";
  document.getElementById('openBtn').style.display = "block";

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ============================================================
   Auto Extraction
   ============================================================ */
async function runExtraction() {
  if (!matchedPdfPage) return;

  const statusDiv = document.getElementById('status');

  try {
    let rawText = "";
    let parsed = null;

    // Text-Layer
    try {
      const tc = await matchedPdfPage.getTextContent();
      rawText = tc.items.map(i => i.str).join(" ");
      const cleanText = rawText.replace(/\s+/g, " ").toUpperCase();
      const hasTotalHour = /TOTAL\s*HOUR/i.test(cleanText);
      const notGarbage = !/^(1\s+)+1?$/.test(cleanText.trim().replace(/\s+/g, " ").substring(0, 100));

      if (hasTotalHour && notGarbage) {
        parsed = parseOCRText(rawText);
      }
    } catch (e) { console.log("Text-Layer error:", e.message); }

    // OCR fallback
    if (!parsed || !parsed.totalHourLine) {
      statusDiv.style.color = "#0056b3";
      statusDiv.innerText = "OCR চলছে...";

      if (!ocrWorker) {
        ocrWorker = await Tesseract.createWorker('eng');
        await ocrWorker.setParameters({
          preserve_interword_spaces: '1',
          tessedit_pageseg_mode: '6'
        });
      }

      const viewport = matchedPdfPage.getViewport({ scale: 3.0 });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      await matchedPdfPage.render({ canvasContext: ctx, viewport }).promise;

      const ocrResult = await ocrWorker.recognize(canvas);
      rawText = ocrResult?.data?.text || "";
      parsed = parseOCRText(rawText);
    }

    // Extract Grade
    const gradeMatch = rawText.toUpperCase().match(/GRADE\s*:?\s*([A-Z0-9][A-Z0-9\s]*?(?=\s*(?:FACILITY|DIVISION|DEPARTMENT|DESIGNATION|COMPANY|LOCATION|$)))/i) ||
                       rawText.toUpperCase().match(/\bM(\d{2})\s+JUNIOR\s+OFFICER\s+([A-F])\b/i);

    let gradeText = "";
    if (gradeMatch) gradeText = gradeMatch[0];

    // Fallback: search for "M18 Junior Officer C" pattern
    if (!gradeText) {
      const gm = rawText.toUpperCase().match(/\bM\d{2}\s+JUNIOR\s+OFFICER\s+[A-F]\b/);
      if (gm) gradeText = gm[0];
    }

    // Detect category from grade
    detectionResult = detectCategory(gradeText, currentSearchId);

    // Apply
    applyExtraction(parsed, detectionResult);

    setCache(currentMonth, currentSearchId, {
      fileUrl: currentFileUrl,
      pageNum: currentPageNum,
      fileName: currentFileName,
      parsed,
      detection: detectionResult,
      gradeText
    });

    statusDiv.style.color = "#28a745";
    statusDiv.innerText = "রিপোর্ট তৈরি হয়েছে";

    document.getElementById('step3').scrollIntoView({ behavior: 'smooth' });

  } catch (e) {
    console.error(e);
    statusDiv.style.color = "#dc3545";
    statusDiv.innerText = "Extraction সমস্যা: " + e.message;
  }
}

/* ============================================================
   Apply extraction result to UI
   ============================================================ */
function applyExtraction(parsed, detection) {
  const gradeInfo = document.getElementById('gradeInfo');
  const calcInputs = document.getElementById('calcInputs');
  const categoryBadge = document.getElementById('categoryBadge');

  // Show grade info
  if (detection.gradeText || detection.reason) {
    gradeInfo.style.display = "block";
    gradeInfo.innerText = `Grade: ${detection.gradeText || "—"} | Detection: ${detection.reason}`;
  }

  if (detection.valid && detection.category) {
    // Valid grade
    document.getElementById('inpCategory').value = detection.category;
    document.getElementById('inpOtHours').value = parsed.otHours;
    document.getElementById('inpHoliday').value = parsed.holidayCount;
    document.getElementById('inpNight').value = parsed.nightCount;
    categoryBadge.className = "badge";
    categoryBadge.innerText = RATE_TABLE[detection.category].name;
    calcInputs.style.display = "block";
    recalculate();
  } else {
    // Invalid grade
    document.getElementById('inpCategory').value = "JO";
    document.getElementById('inpOtHours').value = 0;
    document.getElementById('inpHoliday').value = 0;
    document.getElementById('inpNight').value = 0;
    categoryBadge.className = "badge warn";
    categoryBadge.innerText = "হিসাব করা সম্ভব নয়";
    calcInputs.style.display = "none";
    recalculate();
  }

  document.getElementById('step3').classList.add('show');
  showHolidayList(parsed.holidayDays);
  showNightList(parsed.nightDays);
  showRemarks(parsed.punchProblems, detection);
}

/* ============================================================
   Detect category from grade
   ============================================================ */
function detectCategory(gradeText, empId) {
  const g = (gradeText || "").toUpperCase().trim();

  // 1. Contractual
  if (empId.startsWith("CF")) {
    return { category: "CF", valid: true, reason: "Contractual (CF)", gradeText: g || "CF" };
  }

  // 2. Management/Executive — Block
  if (/\b(EXECUTIVE|SENIOR\s+OFFICER|ASSISTANT\s+MANAGER|MANAGER|DEPUTY|DIRECTOR|HEAD)\b/i.test(g) &&
      !/JUNIOR\s+OFFICER/i.test(g)) {
    return { category: null, valid: false, reason: "Management/Executive — ক্যাটাগরির বাইরে", gradeText: g };
  }

  // 3. Grade letter extraction
  const gradeMatch = g.match(/JUNIOR\s+OFFICER\s+([A-F])\b/i);
  const levelMatch = g.match(/\bM(\d{2})\b/);
  const gradeLetter = gradeMatch ? gradeMatch[1].toUpperCase() : null;
  const levelNum = levelMatch ? parseInt(levelMatch[1]) : null;

  if (gradeLetter) {
    if (gradeLetter === "A" || gradeLetter === "B") {
      return { category: "JO_B", valid: true, reason: `Grade ${gradeLetter} (B & Above)`, gradeText: g };
    }
    if (["C", "D", "E", "F"].includes(gradeLetter)) {
      return { category: "JO", valid: true, reason: `Grade ${gradeLetter} (Below B)`, gradeText: g };
    }
  }

  if (levelNum !== null) {
    if (levelNum === 16 || levelNum === 17) {
      return { category: "JO_B", valid: true, reason: `Level M${levelNum}`, gradeText: g };
    }
    if (levelNum >= 18 && levelNum <= 20) {
      return { category: "JO", valid: true, reason: `Level M${levelNum}`, gradeText: g };
    }
    return { category: null, valid: false, reason: `Level M${levelNum} — ক্যাটাগরির বাইরে`, gradeText: g };
  }

  // 4. Unknown
  return { category: null, valid: false, reason: "Grade সনাক্ত করা যায়নি", gradeText: g || "—" };
}

/* ============================================================
   Parse text
   ============================================================ */
function parseOCRText(rawText) {
  const cleanText = rawText.replace(/\s+/g, " ").toUpperCase();

  let otHours = 0, nightCount = 0;
  let holidayDays = [], nightDays = [], punchProblems = [];
  let totalHourLine = false;

  // Total Hour
  const thIndex = cleanText.search(/TOTAL\s*HOUR/i);
  if (thIndex !== -1) {
    const after = cleanText.substring(thIndex, thIndex + 300);
    const numbers = after.match(/\d+\.\d+|\d+/g) || [];
    if (numbers.length >= 7) {
      const n = numbers.slice(0, 7).map(x => parseFloat(x));
      const valid = n[0] >= 0 && n[1] >= 0 && n[2] >= 0 && n[3] >= 0 &&
                    n[4] >= 0 && n[5] >= 0 && Number.isInteger(n[6]) && n[6] < 200;
      if (valid) {
        otHours = n[1] + n[3] + n[5];
        nightCount = n[6];
        totalHourLine = true;
      }
    }
  }

  if (!totalHourLine) {
    const allNums = cleanText.match(/\d+\.\d+|\d+/g) || [];
    if (allNums.length >= 7) {
      const n = allNums.slice(-7).map(parseFloat);
      if (Number.isInteger(n[6]) && n[6] < 200) {
        otHours = n[1] + n[3] + n[5];
        nightCount = n[6];
        totalHourLine = true;
      }
    }
  }

  // Row scan
  const rowRegex = /(\d{2}\/\d{2}\/\d{4})\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+(YES|NO)\s+(\d{2}:\d{2}:\d{2})\s*-\s*(\d{2}:\d{2}:\d{2})/gi;

  let rm;
  const seenDates = new Set();

  while ((rm = rowRegex.exec(cleanText)) !== null) {
    const date = rm[1];
    if (seenDates.has(date)) continue;
    seenDates.add(date);

    const doDuty  = parseFloat(rm[4]) || 0;
    const doExtra = parseFloat(rm[5]) || 0;
    const holDuty = parseFloat(rm[6]) || 0;
    const holExtra= parseFloat(rm[7]) || 0;
    const isNight = rm[8].toUpperCase() === "YES";
    const inTime  = rm[9];
    const outTime = rm[10];

    if (doDuty > 0 || doExtra > 0 || holDuty > 0 || holExtra > 0) {
      holidayDays.push({ date, doDuty, doExtra, holDuty, holExtra });
    }
    if (isNight) {
      nightDays.push(date);
    }
    if (inTime === "00:00:00" || outTime === "00:00:00") {
      punchProblems.push({ date, inTime, outTime });
    }
  }

  return {
    otHours: Number(otHours.toFixed(2)),
    nightCount,
    holidayCount: holidayDays.length,
    holidayDays,
    nightDays,
    punchProblems,
    totalHourLine
  };
}

/* ============================================================
   Holiday List
   ============================================================ */
function showHolidayList(list) {
  const box = document.getElementById('holidayList');
  if (!list || list.length === 0) {
    box.innerText = "এই মাসে কোনো হলিডে বা DO ডিউটি নেই";
  } else {
    box.innerHTML = list.map((d, i) => {
      const parts = [];
      if (d.doDuty > 0) parts.push(`DO Duty ${d.doDuty} hr`);
      if (d.doExtra > 0) parts.push(`DO Extra ${d.doExtra} hr`);
      if (d.holDuty > 0) parts.push(`Holiday Duty ${d.holDuty} hr`);
      if (d.holExtra > 0) parts.push(`Holiday Extra ${d.holExtra} hr`);
      return `${i + 1}. ${d.date} — ${parts.join(", ")}`;
    }).join("<br>");
  }
  document.getElementById('step4').classList.add('show');
}

/* ============================================================
   Night List
   ============================================================ */
function showNightList(list) {
  const box = document.getElementById('nightList');
  if (!list || list.length === 0) {
    box.innerText = "এই মাসে কোনো নাইট ডিউটি নেই";
  } else {
    box.innerHTML = list.map((d, i) => `${i + 1}. ${d}`).join("<br>");
  }
  document.getElementById('step5').classList.add('show');
}

/* ============================================================
   Remarks
   ============================================================ */
function showRemarks(punchProblems, detection) {
  const box = document.getElementById('remarksBox');
  const issues = [];

  if (!detection.valid) {
    issues.push(`Grade সনাক্তকরণ সমস্যা: ${detection.reason}`);
  }
  if (punchProblems && punchProblems.length > 0) {
    const dates = punchProblems.map(p => p.date).join(", ");
    issues.push(`In/Out Punch সমস্যা: ${dates}`);
  }

  if (issues.length === 0) {
    box.className = "remarks-box remarks-ok";
    box.innerHTML = "আপনার সব In/Out Punch সঠিক আছে।";
  } else if (!detection.valid && punchProblems.length > 0) {
    box.className = "remarks-box remarks-error";
    box.innerHTML = `নিম্নলিখিত সমস্যা আছে:<ul>${issues.map(i => `<li>${i}</li>`).join("")}</ul>ERP Team-এর সাথে যোগাযোগ করুন।`;
  } else if (!detection.valid) {
    box.className = "remarks-box remarks-error";
    box.innerHTML = `আপনার Grade বা Designation আমাদের ক্যাটাগরির বাইরে।<br>হিসাব করা সম্ভব নয়।<br>ERP Team-এর সাথে যোগাযোগ করুন।`;
  } else {
    box.className = "remarks-box remarks-warn";
    box.innerHTML = `আপনার ${punchProblems.map(p => p.date).join(", ")} তারিখে In/Out Punch-এ সমস্যা আছে।<br>ERP Team-এর সাথে যোগাযোগ করুন।`;
  }

  document.getElementById('step6').classList.add('show');
}

/* ============================================================
   Recalculate
   ============================================================ */
function recalculate() {
  const cat = document.getElementById('inpCategory').value;
  const otHours = parseFloat(document.getElementById('inpOtHours').value) || 0;
  const holiday = parseInt(document.getElementById('inpHoliday').value) || 0;
  const night = parseInt(document.getElementById('inpNight').value) || 0;

  const r = RATE_TABLE[cat];

  const otAmount = otHours * r.otRate;
  let holidayAmount = 0;
  if (r.holidayType === "hourly") {
    holidayAmount = holiday * r.holidayHours * r.otRate;
  } else {
    holidayAmount = holiday * r.holidayFlat;
  }
  const nightAmount = night * r.nightRate;
  const grandTotal = otAmount + holidayAmount + nightAmount;

  document.getElementById('lblRate').innerText = `৳ ${r.otRate} / hr`;
  document.getElementById('lblOtAmount').innerText = `৳ ${otAmount.toFixed(2)}`;
  document.getElementById('lblHolidayAmount').innerText = `৳ ${holidayAmount.toFixed(2)}`;
  document.getElementById('lblNightAmount').innerText = `৳ ${nightAmount.toFixed(2)}`;
  document.getElementById('lblGrandTotal').innerText = `৳ ${grandTotal.toFixed(2)}`;
}

/* ============================================================
   PDF page extract
   ============================================================ */
async function extractSinglePagePdf(pdfUrl, pageNumber) {
  const bytes = await fetch(pdfUrl).then(r => r.arrayBuffer());
  const src = await PDFLib.PDFDocument.load(bytes);
  const out = await PDFLib.PDFDocument.create();
  const [pg] = await out.copyPages(src, [pageNumber - 1]);
  out.addPage(pg);
  const outBytes = await out.save();
  return URL.createObjectURL(new Blob([outBytes], { type: 'application/pdf' }));
}

function renderPageHD(page, targetCanvas, divider) {
  const ctx = targetCanvas.getContext('2d');
  const dpr = window.devicePixelRatio || 2;
  const viewport = page.getViewport({ scale: 2.5 });
  targetCanvas.width = Math.floor(viewport.width * dpr);
  targetCanvas.height = Math.floor(viewport.height * dpr);
  targetCanvas.style.width = Math.floor(viewport.width / divider) + "px";
  targetCanvas.style.height = "auto";
  ctx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);
  const transform = dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null;
  page.render({ canvasContext: ctx, transform, viewport });
}

/* ============================================================
   Modal
   ============================================================ */
function openModal() {
  if (!matchedPdfPage) return;
  const modal = document.getElementById('pdfModal');
  const mc = document.getElementById('modal-canvas');
  mc.width = 0; mc.height = 0;
  modal.style.display = "block";
  document.body.style.overflow = "hidden";
  const divider = window.innerWidth < 768 ? 1.15 : 1.0;
  renderPageHD(matchedPdfPage, mc, divider);
}
function closeModal() {
  const modal = document.getElementById('pdfModal');
  if (modal.style.display === "block") {
    modal.style.display = "none";
    document.body.style.overflow = "auto";
    const mc = document.getElementById('modal-canvas');
    mc.width = 0; mc.height = 0;
  }
}
function modalBackdropClick(e) {
  if (e.target.id === "pdfModal") closeModal();
}

/* ============================================================
   Reset
   ============================================================ */
function resetAll() {
  document.getElementById('step1').style.display = "block";
  document.getElementById('step2').style.display = "none";
  ['step3','step4','step5','step6'].forEach(id => document.getElementById(id).classList.remove('show'));
  document.getElementById('status').innerText = "";
  document.getElementById('progress').style.display = "none";
  document.getElementById('employeeId').value = "";

  document.getElementById('inpOtHours').value = 0;
  document.getElementById('inpHoliday').value = 0;
  document.getElementById('inpNight').value = 0;

  currentPdf = null;
  currentFileUrl = null;
  currentPageNum = 1;
  matchedPdfPage = null;

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
